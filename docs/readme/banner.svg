<text x="72" y="97.7" class="e">A LUNAR LIGHT-AND-SHADE GARDEN</text>
<text x="72" y="168" font-size="74" class="t" style="animation-delay:0.15s">THE MOON HAS</text><text x="72" y="240.51999999999998" font-size="74" class="t" style="animation-delay:0.35s">A GARDENER</text>
