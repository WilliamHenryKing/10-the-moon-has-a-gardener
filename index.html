<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>THE MOON HAS A GARDENER</title>
    <meta name="description" content="Shape light and shade to grow a small lunar garden" />
    <meta name="theme-color" content="#04050a" />
    <style>
      /* Arrival veil: a low Sun rising over the crater rim, shown until worldReady() lifts it. */
      html, body { margin: 0; background: #04050a; }
      #arrival { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 22px; background: radial-gradient(120% 70% at 50% 110%, #2a2330 0%, #0b0c16 45%, #04050a 75%); color: #f4efe4; font: 600 12px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.32em; text-transform: uppercase; text-align: center; transition: opacity 0.6s ease, visibility 0.6s; }
      #arrival.is-done { opacity: 0; visibility: hidden; }
      #arrival .orbit { position: relative; width: 120px; height: 120px; border-radius: 50%; border: 1px solid #ffffff1c; }
      #arrival .orbit::before { content: ""; position: absolute; inset: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9fd9ff 0%, #2f6fb0 45%, #0c1a33 72%); box-shadow: 0 0 24px #5aa8ff55; }
      #arrival .sun { position: absolute; inset: 0; animation: arrival-orbit 3.2s linear infinite; }
      #arrival .sun::after { content: ""; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #ffe7b0; box-shadow: 0 0 14px 4px #ffc86299; }
      #arrival small { display: block; margin-top: 8px; font-weight: 500; letter-spacing: 0.18em; color: #a9a6b8; text-transform: none; font-size: 12px; }
      @keyframes arrival-orbit { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #arrival .sun { animation: none; transform: rotate(60deg); } }
    </style>
  </head>
  <body>
    <div id="arrival" role="status" aria-live="polite"><div class="orbit" aria-hidden="true"><div class="sun"></div></div><span>The Moon Has a Gardener<small>Waiting for sunrise on the crater rim…</small></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
